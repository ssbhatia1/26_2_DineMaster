name: Validate & Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: 'GitHub-hosted runner OS to execute on.'

jobs:
  analyze-and-test:
    name: Analyze & Test  (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter desktop support
        if: ${{ runner.os != 'Windows' }}
        run: flutter config --enable-linux-desktop

      - name: Enable macOS desktop support
        if: ${{ runner.os == 'macOS' }}
        run: flutter config --enable-macos-desktop

      - name: Pub get
        run: flutter pub get

      - name: Static analysis (dart analyze)
        # Info-level lints do NOT fail the job; warnings DO (fatal-warnings is
        # the CLI default, kept explicit here). --fatal-infos has no negation,
        # so plain `dart analyze` is the correct non-fatal-infos form.
        run: dart analyze --fatal-warnings

      - name: Run unit & widget tests
        run: flutter test