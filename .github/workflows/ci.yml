name: CI - Push to Master

on:
  push:
    branches: [master]

jobs:
  validate:
    name: Validate & Test
    uses: ./.github/workflows/validate.yml
    with:
      os: ubuntu-latest

  # Android is built on ubuntu-latest (Linux runner) rather than triggering a
  # separate job so caching and secret wiring stays consistent.
  build-android:
    name: Build Android
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: android
      archive-name: dine-master
      version-name: 1.0.0
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-web:
    name: Build Web
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: web
      archive-name: dine-master
      version-name: 1.0.0
      build-number: ${{ github.run_number }}

  build-windows:
    name: Build Windows
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      runner: windows-latest
      platform: windows
      archive-name: dine-master
      version-name: 1.0.0
      build-number: ${{ github.run_number }}

  build-linux:
    name: Build Linux
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: linux
      archive-name: dine-master
      version-name: 1.0.0
      build-number: ${{ github.run_number }}

  build-macos:
    name: Build macOS
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      platform: macos
      archive-name: dine-master
      version-name: 1.0.0
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-ios:
    name: Build iOS
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      platform: ios
      archive-name: dine-master
      version-name: 1.0.0
      build-number: ${{ github.run_number }}
    secrets: inherit