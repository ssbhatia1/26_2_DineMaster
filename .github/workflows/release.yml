name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0; leave blank to read from pubspec.yaml)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  versions:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.resolve.outputs.version-name }}
      tag-name: ${{ steps.resolve.outputs.tag-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: resolve
        shell: bash
        run: |
          INPUT_VER="${{ inputs.version }}"
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$INPUT_VER" ]; then
            RAW="$INPUT_VER"
          elif [[ "$REF_NAME" == v* ]]; then
            RAW="$REF_NAME"
          else
            PUB_VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//; s/[[:space:]]//g')
            RAW="${PUB_VER:-1.0.0}"
          fi
          CLEAN_VER="${RAW#v}"
          TAG_VER="v${CLEAN_VER}"
          echo "version-name=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "tag-name=${TAG_VER}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved version name: ${CLEAN_VER}, tag: ${TAG_VER}"

  validate:
    name: Validate & Test
    needs: versions
    uses: ./.github/workflows/validate.yml
    with:
      os: ubuntu-latest

  build-apk:
    name: Build Android APK
    needs: [versions, validate]
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: android
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-web:
    name: Build Web
    needs: [versions, validate]
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: web
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}

  build-windows:
    name: Build Windows
    needs: [versions, validate]
    uses: ./.github/workflows/build.yml
    with:
      runner: windows-latest
      platform: windows
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}

  build-macos:
    name: Build macOS
    needs: [versions, validate]
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      platform: macos
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-ios:
    name: Build iOS
    needs: [versions, validate]
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      platform: ios
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}
      upload-ios: true
    secrets: inherit

  # Linux desktop builds are best-effort: they commonly fail in GitHub CI
  # due to missing GTK/system libraries, so a failure here is reported but
  # does NOT block the GitHub Release.
  build-linux-nonfatal:
    name: Build Linux (best-effort)
    needs: [versions, validate]
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: linux
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}

  release:
    name: Create GitHub Release
    needs:
      - versions
      - validate
      - build-apk
      - build-web
      - build-windows
      - build-macos
      - build-ios
      - build-linux-nonfatal
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip duplicate run if release already has artifacts
        id: dupcheck
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.versions.outputs.tag-name }}
        run: |
          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --json assets -q '.assets | length' 2>/dev/null || true)"
          if [ -n "$ASSET_COUNT" ] && [ "$ASSET_COUNT" -gt 0 ] 2>/dev/null; then
            echo "::notice::Release $RELEASE_TAG already has $ASSET_COUNT artifact(s); skipping duplicate build."
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifacts
        if: steps.dupcheck.outputs.skip_release != 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false

      - name: Print artifact summary
        if: steps.dupcheck.outputs.skip_release != 'true'
        shell: bash
        run: |
          find release-artifacts -type f -printf '%p (%s bytes)\n'

      - name: Create Private GitHub Release
        if: steps.dupcheck.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versions.outputs.tag-name }}
          name: 'Dine Master ${{ needs.versions.outputs.tag-name }}'
          files: release-artifacts/**/*
          generate_release_notes: true
          # body: |
          #   ## Dine Master ${{ needs.versions.outputs.tag-name }}

          #   Automated production release built by GitHub Actions.

          #   > **Distribution Notice**: This release contains compiled application binaries only. Source code archives are excluded from this release.

          #   ### Included platforms
          #   - **Android**: `dine-master-release.apk` (signed if Android secrets are configured)
          #   - **Web**: `dine-master-web.tar.gz` (hostable static build)
          #   - **Windows**: `dine-master-windows-setup.exe` (Setup Wizard) / `dine-master-windows-x64.zip` (Portable)
          #   - **macOS**: `dine-master-macos.app.zip` (signed if macOS secrets are configured)
          #   - **iOS**: `dine-master-ios.ipa` + App Store Connect (TestFlight) upload (if iOS secrets are configured)

          #   ### Linux
          #   - **Linux**: `dine-master-linux-x64.tar.gz` (${{ needs.build-linux-nonfatal.result == 'success' && 'uploaded' || 'skipped (build failure non-fatal)' }})

          #   Download the compiled artifact for your platform and install it directly.

          #   > **Note**: Application bundle identifier is configured as `com.dinemaster`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Public Release Secrets
        id: check_public_secrets
        shell: bash
        env:
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          if [ -n "$PUBLIC_RELEASE_REPO" ] && [ -n "$PUBLIC_REPO_PAT" ]; then
            echo "has_public_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_public_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Public Release Repository
        if: steps.dupcheck.outputs.skip_release != 'true' && steps.check_public_secrets.outputs.has_public_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.PUBLIC_RELEASE_REPO }}
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ needs.versions.outputs.tag-name }}
          name: 'Dine Master ${{ needs.versions.outputs.tag-name }}'
          files: release-artifacts/**/*
          generate_release_notes: true
          # body: |
          #   ## Dine Master ${{ needs.versions.outputs.tag-name }}

          #   Public automated production release.

          #   > **Distribution Notice**: This release contains compiled application binaries only. Source code archives are excluded.

          #   Download the compiled artifact for your platform and install it directly.
