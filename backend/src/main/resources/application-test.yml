spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:dinemaster_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-only-secret-that-must-never-be-used-in-production
    expiration-ms: 3600000

cloudinary:
  cloud-name: ""
  api-key: ""
  api-secret: ""
